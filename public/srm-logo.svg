      <circle cx="282" cy="136" r="14"/>
      <circle cx="244" cy="118" r="13"/>
      <circle cx="256" cy="118" r="13"/>

      <!-- Delicate Leaf Negative Spaces within Canopy -->
      <g fill="#0B4796" opacity="0.25">
        <circle cx="230" cy="168" r="5"/><circle cx="270" cy="168" r="5"/>
        <circle cx="206" cy="192" r="6"/><circle cx="294" cy="192" r="6"/>
        <circle cx="174" cy="220" r="5"/><circle cx="326" cy="220" r="5"/>
        <circle cx="248" cy="156" r="6"/><circle cx="246" cy="208" r="5"/>
        <circle cx="152" cy="240" r="4"/><circle cx="348" cy="240" r="4"/>
        <circle cx="132" cy="260" r="3.5"/><circle cx="368" cy="260" r="3.5"/>
      </g>
    </g>

    <!-- Bottom Section: Royal Blue Base Banner with SRM MCET -->
    <!-- Crisp White Horizontal Divider Line -->
    <rect x="30" y="335" width="440" height="3.5" fill="#FFFFFF"/>
    
    <!-- Royal Blue Solid Lower Fill -->
    <path d="M 34 338.5 L 466 338.5 A 214 214 0 0 1 34 338.5 Z" fill="url(#bottomBlue)"/>

    <!-- High-Legibility Crisp White SRM MCET Serif Typography -->
    <text x="250" y="408" text-anchor="middle" font-family="'Times New Roman', Times, 'Georgia', 'Cinzel', serif" font-weight="900" font-size="48" fill="#FFFFFF" letter-spacing="3.5">SRM MCET</text>
  </g>


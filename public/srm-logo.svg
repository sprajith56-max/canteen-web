    <!-- Radiant Golden Yellow Sky -->
    <circle cx="250" cy="250" r="214" fill="url(#sunSkyGrad)"/>

    <!-- Sun Halo behind Gopuram Top -->
    <circle cx="250" cy="180" r="160" fill="url(#haloGrad)"/>

    <!-- 16 Sun Rays -->
    <g id="raysGroup">
    <polygon points="250.0,6.0 235.2,95.9 264.8,95.9" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="331.9,22.3 283.8,99.7 311.2,111.0" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="401.3,68.7 327.3,121.8 348.2,142.7" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="447.7,138.1 359.0,158.8 370.3,186.2" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="464.0,220.0 374.1,205.2 374.1,234.8" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="447.7,301.9 370.3,253.8 359.0,281.2" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="401.3,371.3 348.2,297.3 327.3,318.2" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="331.9,417.7 311.2,329.0 283.8,340.3" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="250.0,434.0 264.8,344.1 235.2,344.1" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="168.1,417.7 216.2,340.3 188.8,329.0" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="98.7,371.3 172.7,318.2 151.8,297.3" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="52.3,301.9 141.0,281.2 129.7,253.8" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="36.0,220.0 125.9,234.8 125.9,205.2" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="52.3,138.1 129.7,186.2 141.0,158.8" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="98.7,68.7 151.8,142.7 172.7,121.8" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    <polygon points="168.1,22.3 188.8,111.0 216.2,99.7" fill="#FFC61E" stroke="#F5A600" stroke-width="0.6"/>
    </g>

    <!-- Sun Disc Arch at the crown -->
    <path d="M 160 145 A 95 95 0 0 1 340 145 Z" fill="#FFF9C4" opacity="0.7"/>

    <!-- Dravidian Temple Gopuram (Royal Blue Tower) -->
    <g id="gopuram" fill="url(#templeBlue)">
      <!-- Main Gopuram Pyramidal Structure -->
      <!-- Tier 1 Base -->
      <polygon points="142,335 148,272 352,272 358,335" stroke="#062A5E" stroke-width="1.5"/>
      <!-- Tier 2 -->
      <polygon points="154,272 162,218 338,218 346,272" stroke="#062A5E" stroke-width="1.5"/>
      <!-- Tier 3 -->
      <polygon points="168,218 178,172 322,172 332,218" stroke="#062A5E" stroke-width="1.5"/>
      <!-- Tier 4 Top -->
      <polygon points="182,172 192,132 308,132 318,172" stroke="#062A5E" stroke-width="1.5"/>

      <!-- Top horizontal cornice ridge -->
      <rect x="188" y="122" width="124" height="12" rx="2" fill="#05234D"/>

      <!-- 7 Top Kalasams (Finial Spires) -->
      <!-- 1 -->
      <path d="M 197 122 Q 199 100 202 91 Q 205 100 207 122 Z" fill="#05234D"/>
      <circle cx="202" cy="90" r="3.5" fill="#FFD54F"/>
      <!-- 2 -->
      <path d="M 213 122 Q 215 97 218 86 Q 221 97 223 122 Z" fill="#05234D"/>
      <circle cx="218" cy="85" r="3.8" fill="#FFD54F"/>
      <!-- 3 -->
      <path d="M 229 122 Q 231 93 234 80 Q 237 93 239 122 Z" fill="#05234D"/>
      <circle cx="234" cy="79" r="4.2" fill="#FFD54F"/>
      <!-- Center Tallest 4 -->
      <path d="M 245 122 Q 248 88 250 72 Q 252 88 255 122 Z" fill="#05234D"/>
      <circle cx="250" cy="70" r="5" fill="#FFD54F"/>
      <!-- 5 -->
      <path d="M 261 122 Q 263 93 266 80 Q 269 93 271 122 Z" fill="#05234D"/>
      <circle cx="266" cy="79" r="4.2" fill="#FFD54F"/>
      <!-- 6 -->
      <path d="M 277 122 Q 279 97 282 86 Q 285 97 287 122 Z" fill="#05234D"/>
      <circle cx="282" cy="85" r="3.8" fill="#FFD54F"/>
      <!-- 7 -->
      <path d="M 293 122 Q 295 100 298 91 Q 301 100 303 122 Z" fill="#05234D"/>
      <circle cx="298" cy="90" r="3.5" fill="#FFD54F"/>

      <!-- Temple Architectural Carvings & Moldings -->
      <line x1="145" y1="304" x2="355" y2="304" stroke="#1B6CD1" stroke-width="1.8"/>
      <line x1="158" y1="246" x2="342" y2="246" stroke="#1B6CD1" stroke-width="1.8"/>
      <line x1="172" y1="196" x2="328" y2="196" stroke="#1B6CD1" stroke-width="1.8"/>
      <line x1="186" y1="152" x2="314" y2="152" stroke="#1B6CD1" stroke-width="1.8"/>


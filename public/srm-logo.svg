      <path d="M 250 230 Q 248 285 237 335 Q 250 338 263 335 Q 252 285 250 230 Z"/>
      <path d="M 237 335 Q 218 338 190 339 Q 220 334 237 328 Z"/>
      <path d="M 263 335 Q 282 338 310 339 Q 280 334 263 328 Z"/>


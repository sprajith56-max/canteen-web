<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Clip strictly inside inner boundary of the golden ring -->
    <clipPath id="innerSealClip">
      <circle cx="250" cy="250" r="214" />
    </clipPath>

    <!-- Sun Halo Gradient -->
    <radialGradient id="sunSkyGrad" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="65%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </radialGradient>

    <!-- Sun White/Yellow Core Halo -->
    <radialGradient id="haloGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFF176" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Ring Gradient -->
    <radialGradient id="goldOchreGrad" cx="48%" cy="48%" r="52%">
      <stop offset="75%" stop-color="#C89314"/>
      <stop offset="90%" stop-color="#DFAB27"/>
      <stop offset="98%" stop-color="#B9820A"/>
      <stop offset="100%" stop-color="#9A6B03"/>
    </radialGradient>

    <!-- Blue Gopuram Color -->
    <linearGradient id="templeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0855B5"/>
      <stop offset="50%" stop-color="#0B4796"/>
      <stop offset="100%" stop-color="#063370"/>
    </linearGradient>

    <!-- Bottom Blue Banner Color -->
    <linearGradient id="bottomBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A4A9C"/>
      <stop offset="100%" stop-color="#083E84"/>
    </linearGradient>
  </defs>

  <!-- ================= INSIDE CLIPPED CIRCLE ================= -->

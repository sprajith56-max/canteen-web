      <rect x="236" y="178" width="28" height="22" rx="3" fill="#051E40"/>
      <rect x="232" y="224" width="36" height="26" rx="4" fill="#051E40"/>
    </g>

    <!-- Sacred Kalpavriksha White Tree -->
    <g id="tree" fill="#FFFFFF">
